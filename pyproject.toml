[project]
name = "agentic-cfd"
version = "0.1.0"
description = "Local-only agentic CFD demo (OpenFOAM + LangGraph + Gemini)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.106",
    "langchain-aws>=1.8.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.11.2",
    "pydantic>=2.13.5",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
